name: Daily market-price refresh (6 AM IST)

# Runs every morning at 06:00 IST: wakes the (sleep-when-idle) backend, then
# forces a fresh pull of the day's government mandi prices. The refreshed rows
# are stored in the database, so they stay served even after the web instance
# sleeps again — no always-on instance needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   BACKEND_URL  e.g. https://agrisetuai-backend.onrender.com
#   CRON_TOKEN   the SAME value set as CRON_TOKEN on the backend (Render env)
#
# Prices only change date-wise once the live feed is ON — set PRICES_PROVIDER=
# data_gov_in and DATA_GOV_IN_API_KEY on the backend (see MARKET_PRICES_SETUP.md).

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 AM IST, every day
  workflow_dispatch: {}      # allow a manual run from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions (a full URL, e.g. https://agrisetuai-backend.onrender.com)."
            missing=1
          fi
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::CRON_TOKEN secret is not set. It must match CRON_TOKEN set on the backend (Render env)."
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi
          case "$BACKEND_URL" in
            http://*|https://*) : ;;
            *) echo "::error::BACKEND_URL must start with https:// (got '${BACKEND_URL}')."; exit 1 ;;
          esac

      - name: Wake the backend
        run: |
          base="${BACKEND_URL%/}"
          curl -s -o /dev/null --max-time 90 "${base}/api/health" || true

      - name: Wait for cold start
        run: sleep 25

      - name: Force today's price refresh
        run: |
          base="${BACKEND_URL%/}"   # tolerate a trailing slash in the secret
          if ! code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 180 \
                "${base}/api/cron/run?token=${CRON_TOKEN}&force_prices=1"); then
            echo "::error::Could not reach ${base}/api/cron/run — check BACKEND_URL points at the live backend."
            exit 1
          fi
          echo "HTTP $code"; cat /tmp/out 2>/dev/null; echo
          case "$code" in
            200)
              refreshed=$(grep -o '"prices_refreshed":[0-9]*' /tmp/out | grep -o '[0-9]*' | head -1)
              echo "prices_refreshed=${refreshed:-unknown}"
              if [ "$refreshed" = "0" ]; then
                echo "::warning::Cron reached the backend but refreshed 0 prices. The live feed is likely not configured on the backend (set PRICES_PROVIDER=data_gov_in and DATA_GOV_IN_API_KEY on Render), or the server can't reach data.gov.in (check GET /api/admin/prices/diagnose)."
              else
                echo "Price refresh triggered (${refreshed} rows)."
              fi
              ;;
            404) echo "::error::404 — the cron endpoint is disabled: set CRON_TOKEN on the backend (Render) and redeploy."; exit 1 ;;
            403) echo "::error::403 — token mismatch: the CRON_TOKEN secret must equal CRON_TOKEN on the backend."; exit 1 ;;
            *)   echo "::error::Unexpected HTTP $code from the cron endpoint."; exit 1 ;;
          esac
