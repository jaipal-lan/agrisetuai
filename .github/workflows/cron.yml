name: Daily market-price refresh (6 AM IST)

# Runs every morning at 06:00 IST: wakes the (sleep-when-idle) backend, then
# forces a fresh pull of the day's government mandi prices. The refreshed rows
# are stored in the database, so they stay served even after the web instance
# sleeps again — no always-on instance needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   BACKEND_URL  e.g. https://agrisetuai-backend.onrender.com
#   CRON_TOKEN   the SAME value set as CRON_TOKEN on the backend (Render env)
#
# Prices only change date-wise once the live feed is ON — set PRICES_PROVIDER=
# data_gov_in and DATA_GOV_IN_API_KEY on the backend (see MARKET_PRICES_SETUP.md).

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 AM IST, every day
  workflow_dispatch: {}      # allow a manual run from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend
        run: curl -s -o /dev/null --max-time 90 "${{ secrets.BACKEND_URL }}/api/health" || true

      - name: Wait for cold start
        run: sleep 25

      - name: Force today's price refresh
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 180 \
            "${{ secrets.BACKEND_URL }}/api/cron/run?token=${{ secrets.CRON_TOKEN }}&force_prices=1")
          echo "HTTP $code"; cat /tmp/out || true
          if [ "$code" != "200" ]; then exit 1; fi
