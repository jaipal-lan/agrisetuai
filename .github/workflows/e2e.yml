name: E2E (Playwright)

# The 6 critical-journey UI tests. Runs on PRs and on demand (not every push, so
# it doesn't slow the fast smoke gate). Boots a seeded DEV backend + the built
# frontend, then runs Playwright against them.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Critical-journey E2E
    runs-on: ubuntu-latest
    env:
      DEV_MODE: "true"
      DATABASE_URL: sqlite:///./e2e.db
      AUTH_SECRET: e2e-secret
      AUTO_MIGRATE: "false"
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4

      # --- Backend: migrate, seed, serve ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate + seed
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seed
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health

      # --- Frontend: build, serve ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build + start frontend
        working-directory: web
        run: |
          npm run build
          nohup npm start > ../frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000 >/dev/null

      - name: Run E2E
        working-directory: web
        run: npm run e2e

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
